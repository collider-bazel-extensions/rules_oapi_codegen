name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  consumer:
    # The commit's release archive (git archive honours .gitattributes
    # export-ignore, as GitHub's tag tarballs do) must load with //... for a
    # consumer.
    name: consumer (ubuntu-latest, git archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # linux-sandbox needs unprivileged user namespaces; without them Bazel
      # falls back to a sandbox that can't block the network.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: bazel query @rules_oapi_codegen//... and build ts_oapi_types from the archive
        run: .github/consumer/check.sh "$RUNNER_TEMP/consumer"

  linux:
    name: bazel test (ubuntu-latest, Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.x: downstream consumers (monok8s) are on Bazel 8. 9.x: latest.
        bazel: ["8.x", "9.x"]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.bazel }}
          repository-cache: true

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The runner's `bazel` is the npm bazelisk (a node script), which would
      # break once host Node.js is gone. Put a native, sha256-checked
      # bazelisk first on PATH instead.
      - name: Native bazelisk
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bazelisk"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64
          echo "a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8  $dir/bazel" | sha256sum -c -
          chmod +x "$dir/bazel"
          echo "$dir" >> "$GITHUB_PATH"

      # The runner ships Go and Node.js, including /usr/bin/go and
      # /usr/local/bin/node. Drop every PATH entry that holds one of them,
      # and delete them from the system bin dirs: Bazel's action PATH
      # includes /bin:/usr/bin:/usr/local/bin whatever the job's PATH says.
      # Green tests then prove codegen uses the rules_go SDK (oapi-codegen's
      # goimports pass shells out to `go env`) and the pinned Node.js, not
      # host tools. (JavaScript actions use the runner's own bundled node.)
      - name: Remove host Go and Node.js
        run: |
          set -euo pipefail
          tools=(go gofmt node npm npx corepack tsc)
          for d in /bin /usr/bin /usr/local/bin; do
            for b in "${tools[@]}"; do
              if [[ -e "$d/$b" || -L "$d/$b" ]]; then
                echo "deleting $d/$b -> $(readlink -f "$d/$b" || true)"
                sudo rm -f "$d/$b"
              fi
            done
          done
          new=""
          IFS=: read -ra dirs <<< "$PATH"
          for d in "${dirs[@]}"; do
            if [[ -x "$d/go" || -x "$d/node" ]]; then
              echo "dropping $d from PATH"
              continue
            fi
            new="${new:+$new:}$d"
          done
          echo "PATH=$new" >> "$GITHUB_ENV"

      - name: Verify NO host go or node
        run: |
          set -euo pipefail
          for b in go node; do
            if command -v "$b" >/dev/null 2>&1; then
              echo "FAIL: $b found at $(command -v "$b"); the hermeticity proof would be meaningless" >&2
              exit 1
            fi
            for d in /bin /usr/bin /usr/local/bin; do
              [[ ! -e "$d/$b" ]] || { echo "FAIL: $d/$b still exists" >&2; exit 1; }
            done
          done
          echo "OK — no host go or node on PATH or in Bazel's default action PATH"
          echo "bazel: $(command -v bazel)"; bazel --version

      - name: bazel build //...
        run: bazel build //...

      # --test_output=all so the log shows the ts_oapi_types tests' own output
      # (tsc version, PASS lines), not just a status.
      - name: bazel test //... (analysis + end-to-end codegen)
        run: bazel test //... --test_output=all

      # Before anything else builds there: a fresh output base, so a fetched
      # repository can only come from this build.
      - name: e2e consumer — a Go-only build fetches no Node.js / npm
        run: e2e/consumer/go_only_check.sh "$RUNNER_TEMP/go_only"

      - name: e2e consumer (separate root module, own Go SDK and go_deps; rules_ts ts_project over ts_oapi_types)
        working-directory: e2e/consumer
        run: bazel test //... --test_output=errors

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-${{ matrix.bazel }}
          path: |
            bazel-testlogs/
            e2e/consumer/bazel-testlogs/
          if-no-files-found: ignore
