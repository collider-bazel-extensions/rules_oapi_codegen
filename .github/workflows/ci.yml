name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  consumer:
    # The commit's release archive (git archive honours .gitattributes
    # export-ignore, as GitHub's tag tarballs do) must load with //... for a
    # consumer.
    name: consumer (ubuntu-latest, git archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: bazel query @rules_oapi_codegen//... from the archive
        run: .github/consumer/check.sh "$RUNNER_TEMP/consumer"

  linux:
    name: bazel test (ubuntu-latest, Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.x: downstream consumers (monok8s) are on Bazel 8. 9.x: latest.
        bazel: ["8.x", "9.x"]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.bazel }}
          repository-cache: true

      # The runner ships Go, including /usr/bin/go. Drop every PATH entry that
      # holds a `go` binary, and delete go/gofmt from the system bin dirs:
      # Bazel's action PATH includes /bin:/usr/bin:/usr/local/bin whatever the
      # job's PATH says. Green tests then prove codegen uses the rules_go SDK,
      # not host Go (oapi-codegen's goimports pass shells out to `go env`).
      - name: Remove host Go
        run: |
          set -euo pipefail
          for d in /bin /usr/bin /usr/local/bin; do
            for b in go gofmt; do
              if [[ -e "$d/$b" || -L "$d/$b" ]]; then
                echo "deleting $d/$b -> $(readlink -f "$d/$b" || true)"
                sudo rm -f "$d/$b"
              fi
            done
          done
          new=""
          IFS=: read -ra dirs <<< "$PATH"
          for d in "${dirs[@]}"; do
            if [[ -x "$d/go" ]]; then
              echo "dropping $d from PATH"
              continue
            fi
            new="${new:+$new:}$d"
          done
          echo "PATH=$new" >> "$GITHUB_ENV"

      - name: Verify NO host go
        run: |
          set -euo pipefail
          if command -v go >/dev/null 2>&1; then
            echo "FAIL: go found at $(command -v go); the hermeticity proof would be meaningless" >&2
            exit 1
          fi
          for d in /bin /usr/bin /usr/local/bin; do
            [[ ! -e "$d/go" ]] || { echo "FAIL: $d/go still exists" >&2; exit 1; }
          done
          echo "OK — no host go on PATH or in Bazel's default action PATH"

      - name: bazel build //...
        run: bazel build //...

      - name: bazel test //... (analysis + end-to-end codegen)
        run: bazel test //... --test_output=errors

      - name: e2e consumer (separate root module, own Go SDK and go_deps)
        working-directory: e2e/consumer
        run: bazel test //... --test_output=errors

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-${{ matrix.bazel }}
          path: |
            bazel-testlogs/
            e2e/consumer/bazel-testlogs/
          if-no-files-found: ignore
